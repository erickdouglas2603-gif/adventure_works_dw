version: 2

models:

  - name: int_dimensao_produtos
    description: "Integra os dados de produtos, subcategorias, categorias e modelos da Adventure Works."

    columns:

      - name: PK_product
        description: "Identificador único do produto."
        tests:
          - not_null
          - unique

      - name: FK_product_sub_category
        description: "Identificador da subcategoria do produto."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__production_productsubcategory')
                field: PK_product_sub_category

      - name: FK_product_category
        description: "Identificador da categoria do produto."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__production_productcategory')
                field: PK_product_category

      - name: FK_product_model_id
        description: "Identificador do modelo do produto."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__production_productmodel')
                field: PK_product_model


  - name: int_dimensao_clientes
    description: "Integra os dados de clientes, pessoas e lojas, consolidando clientes pessoa e clientes loja em uma única entidade."

    columns:

      - name: PK_customer
        description: "Identificador único do cliente."
        tests:
          - not_null
          - unique

      - name: FK_person
        description: "Identificador da pessoa associada ao cliente. Pode ser nulo para clientes loja."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__person_person')
                field: PK_business_entity

      - name: customer_name
        description: "Nome do cliente, obtido da pessoa ou da loja."
        tests:
          - not_null

      - name: suffix
        description: "Sufixo do nome da pessoa. Pode ser nulo para clientes loja."

      - name: FK_store
        description: "Identificador da loja associada ao cliente. Pode ser nulo para clientes pessoa."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_store')
                field: PK_sales_store

      - name: FK_territory
        description: "Identificador do território associado ao cliente."

      - name: rowguid
        description: "Identificador global do registro na origem."

      - name: modified_date
        description: "Data da última modificação do registro."

  - name: int_dimensao_enderecos
    description: "Integra os dados de endereços, estados e países da Adventure Works. O grain do modelo é um registro por endereço."

    columns:

      - name: PK_address
        description: "Identificador único do endereço."
        tests:
          - not_null
          - unique

      - name: address_line_1
        description: "Primeira linha do endereço."

      - name: address_line_2
        description: "Segunda linha do endereço. Pode ser nula."

      - name: city
        description: "Cidade do endereço."

      - name: postal_code
        description: "Código postal do endereço."

      - name: FK_state_province
        description: "Identificador do estado ou província associado ao endereço."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__person_stateprovince')
                field: PK_state_province

      - name: state_province_code
        description: "Código do estado ou província."

      - name: state_province_name
        description: "Nome do estado ou província."

      - name: FK_country_region
        description: "Identificador do país ou região associado ao endereço."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__person_countryregion')
                field: PK_country_region

      - name: country_region_name
        description: "Nome do país ou região."

      - name: rowguid
        description: "Identificador global do registro na origem."

      - name: modified_date
        description: "Data da última modificação do endereço na origem."

  - name: int_fato_vendas
    description: >
      Modelo intermediário que integra os itens dos pedidos de venda
      com os respectivos cabeçalhos dos pedidos.
      
      Grain: uma linha por item de pedido (salesorderdetail).
      
      O modelo mantém os atributos transacionais necessários para
      construção da fato de vendas e disponibiliza as chaves estrangeiras
      necessárias para relacionamento com as dimensões.

    columns:

      - name: PK_sales_order_detail
        description: "Identificador único do item do pedido. Define o grain do modelo."
        tests:
          - not_null
          - unique

      - name: FK_sales_order
        description: "Identificador do pedido ao qual o item pertence."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_salesorderheader')
                field: PK_sales_order

      - name: FK_product
        description: "Identificador do produto vendido."

      - name: FK_special_offer
        description: "Identificador da oferta especial aplicada ao item."

      - name: FK_customer
        description: "Identificador do cliente associado ao pedido."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_customer')
                field: PK_customer

      - name: FK_sales_person
        description: "Identificador do vendedor associado ao pedido."

      - name: FK_territory
        description: "Identificador do território associado ao pedido."

      - name: FK_bill_to_address
        description: "Identificador do endereço utilizado para cobrança."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__person_address')
                field: PK_address

      - name: FK_ship_to_address
        description: "Identificador do endereço utilizado para entrega."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__person_address')
                field: PK_address

      - name: FK_ship_method
        description: "Identificador do método de envio."

      - name: FK_credit_card
        description: "Identificador do cartão de crédito utilizado."

      - name: revision_number
        description: "Número de revisão do pedido."

      - name: order_date
        description: "Data de realização do pedido."

      - name: due_date
        description: "Data prevista para entrega."

      - name: ship_date
        description: "Data de envio."

      - name: status_order
        description: "Status do pedido."

      - name: online_order_flag
        description: "Indica se o pedido foi realizado online."

      - name: purchase_order_number
        description: "Número do pedido de compra."

      - name: account_number
        description: "Número da conta do cliente."

      - name: credit_card_approval_code
        description: "Código de aprovação do cartão."

      - name: currency_rate_id
        description: "Identificador da taxa de câmbio."

      - name: subtotal
        description: "Subtotal do pedido."

      - name: tax_amt
        description: "Valor de imposto do pedido."

      - name: freight
        description: "Valor de frete do pedido."

      - name: total_due
        description: "Valor total devido do pedido."

      - name: order_comment
        description: "Comentário associado ao pedido."

      - name: carrier_tracking_number
        description: "Código de rastreamento da transportadora."

      - name: orderqty
        description: "Quantidade de unidades do produto no item."

      - name: unit_price
        description: "Preço unitário do produto."

      - name: unit_price_discount
        description: "Desconto unitário aplicado ao item."

      - name: detail_rowguid
        description: "Identificador global do item do pedido."

      - name: detail_modified_date
        description: "Data da última modificação do item."

      - name: order_rowguid
        description: "Identificador global do pedido."

      - name: order_modified_date
        description: "Data da última modificação do pedido."

  - name: int_dimensao_motivos
    description: "Modelo intermediário dos motivos de venda, preparando a entidade para consumo pela dimensão de motivos."

    columns:

      - name: PK_sales_reason
        description: "Identificador único do motivo de venda."
        tests:
          - not_null
          - unique

      - name: reason_name
        description: "Nome do motivo de venda."

      - name: reason_type
        description: "Tipo ou categoria do motivo de venda."

      - name: modified_date
        description: "Data da última alteração do registro."
  
  - name: int_pedidos_motivos
    description: "Relacionamento entre pedidos e motivos de venda. Cada linha representa uma associação entre um pedido e um motivo."

    columns:

      - name: FK_sales_order
        description: "Identificador do pedido associado ao motivo."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_salesorderheader')
                field: PK_sales_order

      - name: FK_sales_reason
        description: "Identificador do motivo de venda associado ao pedido."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_reason')
                field: PK_sales_reason

  - name: int_dimensao_territorios
    description: >
      Preparação da dimensão de territórios de vendas.
      Grain: uma linha por território.

    columns:

      - name: PK_territory
        description: "Identificador único do território. Define o grain da dimensão."
        tests:
          - not_null
          - unique

      - name: territory_name
        description: "Nome do território de vendas."

      - name: country_region_code
        description: "Código do país ou região associado ao território."

      - name: territory_group
        description: "Grupo geográfico ao qual o território pertence."

      - name: sales_ytd
        description: "Valor de vendas acumulado no ano registrado na origem."

      - name: sales_last_year
        description: "Valor de vendas do ano anterior registrado na origem."

      - name: cost_ytd
        description: "Custo acumulado no ano registrado na origem."

      - name: cost_last_year
        description: "Custo do ano anterior registrado na origem."

      - name: rowguid
        description: "Identificador global do registro na origem."

      - name: modified_date
        description: "Data da última alteração do registro."