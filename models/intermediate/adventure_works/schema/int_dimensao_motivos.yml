version: 2

models:
  - name: int_dimensao_motivos
    description: >
      Modelo intermediário da dimensão de motivos de venda.

      Grain: uma linha por motivo de venda.

    columns:

      - name: PK_motivo_venda
        description: "Identificador único do motivo de venda."
        tests:
          - not_null
          - unique

      - name: nome_motivo
        description: "Nome do motivo de venda."

      - name: tipo_motivo
        description: "Tipo ou categoria do motivo de venda."

      - name: data_modificacao
        description: "Data da última alteração do registro."