version: 2

models:
  - name: int_fato_vendas
    description: >
      Modelo intermediário da fato de vendas da Adventure Works.

      Grain: uma linha por item de pedido.

      O modelo combina o cabeçalho e os itens dos pedidos,
      mantendo o nível transacional do item e calculando os
      valores negociado e líquido negociado.

    columns:

      - name: PK_item_pedido
        description: "Identificador único do item do pedido. Define o grain da fato."
        tests:
          - not_null
          - unique

      # FKs

      - name: FK_pedido
        description: "Identificador do pedido ao qual o item pertence."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_salesorderheader')
                field: PK_pedido

      - name: FK_produto
        description: "Identificador do produto vendido."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__production_product')
                field: PK_produto

      - name: FK_oferta_especial
        description: "Identificador da oferta especial associada ao item."

      - name: FK_cliente
        description: "Identificador do cliente associado ao pedido."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_customer')
                field: PK_cliente

      - name: FK_vendedor
        description: "Identificador do vendedor associado ao pedido."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_salesperson')
                field: PK_vendedor

      - name: FK_territorio
        description: "Identificador do território associado ao pedido."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_salesterritory')
                field: PK_territorio

      - name: FK_endereco_cobranca
        description: "Identificador do endereço de cobrança."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__person_address')
                field: PK_endereco

      - name: FK_endereco_entrega
        description: "Identificador do endereço de entrega."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__person_address')
                field: PK_endereco

      - name: FK_metodo_envio
        description: "Identificador do método de envio."

      - name: FK_cartao_credito
        description: "Identificador do cartão de crédito utilizado."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_creditcard')
                field: PK_cartao_credito

      - name: FK_taxa_cambio
        description: "Identificador da taxa de câmbio associada ao pedido."

      # Datas

      - name: data_pedido
        description: "Data em que o pedido foi realizado."

      - name: data_vencimento
        description: "Data prevista para entrega ou vencimento do pedido."

      - name: data_envio
        description: "Data em que o pedido foi enviado."

      # Atributos

      - name: numero_revisao
        description: "Número da revisão do pedido."

      - name: status_pedido
        description: "Status do pedido."

      - name: indicador_pedido_online
        description: "Indica se o pedido foi realizado online."

      - name: numero_pedido_compra
        description: "Número do pedido de compra informado pelo cliente."

      - name: numero_conta
        description: "Número da conta associada ao pedido."

      - name: codigo_aprovacao_cartao
        description: "Código de aprovação da transação do cartão."

      - name: comentario_pedido
        description: "Comentário associado ao pedido."

      - name: numero_rastreamento
        description: "Número de rastreamento da entrega."

      - name: rowguid_item
        description: "Identificador global do item do pedido."

      - name: rowguid_pedido
        description: "Identificador global do pedido."

      - name: data_modificacao_item
        description: "Data da última modificação do item."

      - name: data_modificacao_pedido
        description: "Data da última modificação do pedido."

      # Medidas

      - name: quantidade_pedida
        description: "Quantidade de unidades vendidas no item."

      - name: preco_unitario
        description: "Preço unitário do produto."

      - name: desconto_preco_unitario
        description: "Desconto aplicado ao preço unitário."

      - name: valor_negociado
        description: >
          Valor bruto negociado do item, calculado pela multiplicação
          da quantidade pelo preço unitário.

      - name: valor_liquido_negociado
        description: >
          Valor negociado após a aplicação do desconto sobre o preço unitário.