version: 2

models:

  - name: stg_adventure_works__production_product
    description: "Staging dos produtos da Adventure Works, com padronização de nomes e tipos."

    columns:

      - name: PK_product
        description: "Identificador único do produto."
        tests:
          - not_null
          - unique

      - name: product_name
        description: "Nome do produto."

      - name: product_number
        description: "Código comercial do produto."

      - name: make_flag
        description: "Indica se o produto é fabricado pela empresa."

      - name: finished_goods_flag
        description: "Indica se o produto é um produto acabado."

      - name: color
        description: "Cor do produto."

      - name: safety_stock_level
        description: "Quantidade mínima de estoque de segurança."

      - name: reorder_point
        description: "Quantidade de estoque que determina o momento de reposição."

      - name: standard_cost
        description: "Custo padrão do produto."

      - name: listprice
        description: "Preço de lista do produto."

      - name: size
        description: "Tamanho do produto."

      - name: sizeunitmeasurecode
        description: "Código da unidade de medida utilizada para o tamanho."

      - name: weightunitmeasurecode
        description: "Código da unidade de medida utilizada para o peso."

      - name: weight
        description: "Peso do produto."

      - name: days_to_manufacture
        description: "Quantidade de dias necessários para fabricar o produto."

      - name: product_line
        description: "Linha à qual o produto pertence."

      - name: class
        description: "Classificação do produto."

      - name: style
        description: "Estilo do produto."

      - name: FK_product_sub_category
        description: "Identificador da subcategoria do produto."

      - name: FK_product_model_id
        description: "Identificador do modelo do produto."

      - name: sell_start_date
        description: "Data de início da venda do produto."

      - name: sell_end_date
        description: "Data de término da venda do produto."

      - name: discontinued_date
        description: "Data em que o produto foi descontinuado. Pode ser nula."

      - name: rowguid
        description: "Identificador global do registro na origem."

      - name: modified_date
        description: "Data da última modificação do registro."


  - name: stg_adventure_works__production_productsubcategory
    description: "Staging das subcategorias de produtos da Adventure Works."

    columns:

      - name: PK_product_sub_category
        description: "Identificador único da subcategoria."
        tests:
          - not_null
          - unique

      - name: FK_product_category
        description: "Identificador da categoria à qual a subcategoria pertence."

      - name: product_sub_category_name
        description: "Nome da subcategoria."

      - name: rowguid
        description: "Identificador global do registro na origem."

      - name: modified_date
        description: "Data da última modificação do registro."


  - name: stg_adventure_works__production_productcategory
    description: "Staging das categorias de produtos da Adventure Works."

    columns:

      - name: PK_product_category
        description: "Identificador único da categoria."
        tests:
          - not_null
          - unique

      - name: product_category_name
        description: "Nome da categoria."

      - name: rowguid
        description: "Identificador global do registro na origem."

      - name: modified_date
        description: "Data da última modificação do registro."


  - name: stg_adventure_works__production_productmodel
    description: "Staging dos modelos de produtos da Adventure Works."

    columns:

      - name: PK_product_model
        description: "Identificador único do modelo do produto."
        tests:
          - not_null
          - unique

      - name: product_model_name
        description: "Nome do modelo do produto."

      - name: catalog_description
        description: "Descrição do modelo utilizada no catálogo. Pode ser nula."

      - name: instructions
        description: "Instruções associadas ao modelo do produto. Pode ser nula."

      - name: rowguid
        description: "Identificador global do registro na origem."

      - name: modified_date
        description: "Data da última modificação do registro."

  - name: stg_adventure_works__sales_customer
    description: "Staging dos clientes da Adventure Works, com padronização de nomes e tipos."

    columns:

        - name: PK_customer
          description: "Identificador único do cliente."
          tests:
            - not_null
            - unique

        - name: FK_person
          description: "Identificador da pessoa associada ao cliente."
          tests:
            - relationships:
                arguments:
                  to: ref('stg_adventure_works__person_person')
                  field: PK_business_entity

        - name: FK_store
          description: "Identificador da loja associada ao cliente."

        - name: FK_territory
          description: "Identificador do território associado ao cliente."

        - name: rowguid
          description: "Identificador global do registro na origem."

        - name: modified_date
          description: "Data da última modificação do registro."


  - name: stg_adventure_works__person_person
    description: "Staging das pessoas da Adventure Works, com padronização de nomes e tipos."

    columns:

        - name: PK_business_entity
          description: "Identificador único da entidade de negócio."
          tests:
            - not_null
            - unique

        - name: person_type
          description: "Tipo da pessoa."

        - name: name_style
          description: "Indica se o nome segue o padrão ocidental."

        - name: title
          description: "Título da pessoa. Pode ser nulo."

        - name: first_name
          description: "Primeiro nome da pessoa."

        - name: middle_name
          description: "Nome do meio da pessoa. Pode ser nulo."

        - name: last_name
          description: "Sobrenome da pessoa."

        - name: suffix
          description: "Sufixo do nome. Pode ser nulo."

        - name: email_promotion
          description: "Indica a preferência da pessoa em relação ao recebimento de promoções por email."

        - name: rowguid
          description: "Identificador global do registro na origem."

        - name: modified_date
          description: "Data da última modificação do registro."


  - name: stg_adventure_works__person_businessentityaddress
    description: "Staging do relacionamento entre entidades de negócio e endereços da Adventure Works."

    columns:

        - name: PK_business_entity
          description: "Identificador da entidade de negócio."

        - name: FK_address
          description: "Identificador do endereço."
          tests:
            - not_null
            - relationships:
                arguments:
                  to: ref('stg_adventure_works__person_address')
                  field: PK_address

        - name: FK_address_type
          description: "Identificador do tipo de endereço."

        - name: rowguid
          description: "Identificador global do registro na origem."

        - name: modified_date
          description: "Data da última modificação do registro."


  - name: stg_adventure_works__person_address
    description: "Staging dos endereços da Adventure Works."

    columns:

        - name: PK_address
          description: "Identificador único do endereço."
          tests:
            - not_null
            - unique

        - name: address_line_1
          description: "Primeira linha do endereço."

        - name: address_line_2
          description: "Segunda linha do endereço. Pode ser nula."

        - name: city
          description: "Cidade do endereço."

        - name: FK_state_province
          description: "Identificador do estado ou província."
          tests:
            - relationships:
                arguments:
                  to: ref('stg_adventure_works__person_stateprovince')
                  field: PK_state_province

        - name: postal_code
          description: "Código postal do endereço."

        - name: spatial_location
          description: "Localização espacial do endereço. Pode ser nula."

        - name: rowguid
          description: "Identificador global do registro na origem."

        - name: modified_date
          description: "Data da última modificação do registro."


  - name: stg_adventure_works__person_stateprovince
    description: "Staging dos estados e províncias da Adventure Works."

    columns:

        - name: PK_state_province
          description: "Identificador único do estado ou província."
          tests:
            - not_null
            - unique

        - name: state_province_code
          description: "Código do estado ou província."

        - name: FK_country_region
          description: "Código do país ou região."
          tests:
            - relationships:
                arguments:
                  to: ref('stg_adventure_works__person_countryregion')
                  field: PK_country_region

        - name: is_only_state_province
          description: "Indica se o registro representa exclusivamente um estado ou província."

        - name: state_province_name
          description: "Nome do estado ou província."

        - name: FK_territory
          description: "Identificador do território."

        - name: rowguid
          description: "Identificador global do registro na origem."

        - name: modified_date
          description: "Data da última modificação do registro."


  - name: stg_adventure_works__person_countryregion
    description: "Staging dos países e regiões da Adventure Works."

    columns:

        - name: PK_country_region
          description: "Código único do país ou região."
          tests:
            
            - unique

        - name: country_region_name
          description: "Nome do país ou região."

        - name: modified_date
          description: "Data da última modificação do registro."