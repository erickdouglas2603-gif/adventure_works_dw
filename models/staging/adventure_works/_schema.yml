version: 2

models:

  # ============================================================
  # PERSON
  # ============================================================

  - name: stg_adventure_works__person_address
    description: "Staging da tabela de endereços da Adventure Works."

    columns:

      - name: PK_address
        description: "Identificador único do endereço."
        tests:
          - not_null
          - unique

      - name: address_line_1
        description: "Primeira linha do endereço."

      - name: address_line_2
        description: "Segunda linha do endereço. Pode ser nula."

      - name: city
        description: "Cidade do endereço."

      - name: FK_state_province
        description: "Identificador do estado ou província associado ao endereço."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_adventure_works__person_stateprovince')
                field: PK_state_province

      - name: postal_code
        description: "Código postal do endereço."

      - name: spatial_location
        description: "Localização espacial do endereço."

      - name: rowguid
        description: "Identificador global do registro na origem."

      - name: modified_date
        description: "Data da última alteração do endereço na origem."


  - name: stg_adventure_works__person_addresstype
    description: "Staging da tabela de tipos de endereço da Adventure Works."

    columns:

      - name: PK_address_type
        description: "Identificador único do tipo de endereço."
        tests:
          - not_null
          - unique

      - name: name_type_address
        description: "Nome do tipo de endereço."

      - name: rowguid
        description: "Identificador global do registro na origem."

      - name: modified_date
        description: "Data da última alteração do registro na origem."


  - name: stg_adventure_works__person_businessentityaddress
    description: >
      Staging da associação entre entidades de negócio e endereços.
      Cada linha representa uma associação entre uma entidade de negócio,
      um endereço e um tipo de endereço.

      Grain: uma linha por combinação de
      FK_business_entity + FK_address + FK_address_type.

    columns:

      - name: FK_business_entity
        description: "Identificador da entidade de negócio associada ao endereço."

      - name: FK_address
        description: "Identificador do endereço associado."

      - name: FK_address_type
        description: "Identificador do tipo de endereço associado."

      - name: rowguid
        description: "Identificador global do registro na origem."

      - name: modified_date
        description: "Data da última alteração do registro na origem."


  - name: stg_adventure_works__person_countryregion
    description: >
      Staging da tabela de países e regiões da Adventure Works.
      A fonte possui um registro com PK_country_region nula,
      identificado durante a validação de qualidade dos dados.

    columns:

      - name: PK_country_region
        description: "Identificador único do país ou região."
        tests:
          - unique

      - name: country_region_name
        description: "Nome do país ou região."

      - name: modified_date
        description: "Data da última alteração do registro na origem."


  - name: stg_adventure_works__person_person
    description: "Staging da tabela de pessoas da Adventure Works."

    columns:

      - name: PK_business_entity
        description: "Identificador único da entidade de negócio associada à pessoa."
        tests:
          - not_null
          - unique

      - name: person_type
        description: "Tipo de pessoa."

      - name: name_style
        description: "Indica se o nome utiliza o padrão ocidental ou oriental."

      - name: title
        description: "Título da pessoa. Pode ser nulo."

      - name: suffix
        description: "Sufixo do nome da pessoa. Pode ser nulo."

      - name: person_name
        description: "Nome completo da pessoa."

      - name: email_promotion
        description: "Indica o nível de aceitação de promoções por e-mail."

      - name: rowguid
        description: "Identificador global do registro na origem."

      - name: modified_date
        description: "Data da última alteração do registro na origem."


  - name: stg_adventure_works__person_stateprovince
    description: "Staging da tabela de estados e províncias da Adventure Works."

    columns:

      - name: PK_state_province
        description: "Identificador único do estado ou província."
        tests:
          - not_null
          - unique

      - name: state_province_code
        description: "Código do estado ou província."

      - name: state_province_name
        description: "Nome do estado ou província."

      - name: FK_country_region
        description: "Identificador do país ou região associado ao estado ou província."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_adventure_works__person_countryregion')
                field: PK_country_region

      - name: FK_territory
        description: "Identificador do território de vendas associado ao estado ou província."

      - name: rowguid
        description: "Identificador global do registro na origem."

      - name: modified_date
        description: "Data da última alteração do registro na origem."


  # ============================================================
  # PRODUCTION
  # ============================================================

  - name: stg_adventure_works__production_product
    description: "Staging da tabela de produtos da Adventure Works."

    columns:

      - name: PK_product
        description: "Identificador único do produto."
        tests:
          - not_null
          - unique

      - name: name_product
        description: "Nome do produto."

      - name: product_number
        description: "Código do produto."

      - name: make_flag
        description: "Indica se o produto é fabricado pela Adventure Works."

      - name: finished_goods_flag
        description: "Indica se o produto é um produto acabado."

      - name: color
        description: "Cor do produto. Pode ser nula."

      - name: safety_stock_level
        description: "Nível de estoque de segurança."

      - name: reorder_point
        description: "Ponto de reposição do estoque."

      - name: standard_cost
        description: "Custo padrão do produto."

      - name: list_price
        description: "Preço de lista do produto."

      - name: size
        description: "Tamanho do produto. Pode ser nulo."

      - name: size_unit_measure_code
        description: "Código da unidade de medida do tamanho."

      - name: weight_unit_measure_code
        description: "Código da unidade de medida do peso."

      - name: weight
        description: "Peso do produto. Pode ser nulo."

      - name: days_to_manufacture
        description: "Quantidade de dias necessários para fabricação."

      - name: product_line
        description: "Linha do produto. Pode ser nula."

      - name: class_product
        description: "Classificação do produto. Pode ser nula."

      - name: style_product
        description: "Estilo do produto. Pode ser nulo."

      - name: FK_product_sub_category
        description: "Identificador da subcategoria do produto."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__production_productsubcategory')
                field: PK_product_sub_category

      - name: FK_product_model_id
        description: "Identificador do modelo do produto."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__production_productmodel')
                field: PK_product_model

      - name: sell_start_date
        description: "Data de início da venda do produto."

      - name: sell_end_date
        description: "Data de encerramento da venda do produto. Pode ser nula."

      - name: discontinued_date
        description: "Data em que o produto foi descontinuado. Pode ser nula."

      - name: rowguid
        description: "Identificador global do registro na origem."

      - name: modified_date
        description: "Data da última alteração do produto na origem."


  - name: stg_adventure_works__production_productcategory
    description: "Staging da tabela de categorias de produtos da Adventure Works."

    columns:

      - name: PK_product_category
        description: "Identificador único da categoria de produto."
        tests:
          - not_null
          - unique

      - name: name_product_category
        description: "Nome da categoria de produto."

      - name: rowguid
        description: "Identificador global do registro na origem."

      - name: modified_date
        description: "Data da última alteração da categoria na origem."


  - name: stg_adventure_works__production_productmodel
    description: "Staging da tabela de modelos de produtos da Adventure Works."

    columns:

      - name: PK_product_model
        description: "Identificador único do modelo de produto."
        tests:
          - not_null
          - unique

      - name: name_product_model
        description: "Nome do modelo de produto."

      - name: catalog_description
        description: "Descrição do produto no catálogo."

      - name: instructions
        description: "Instruções relacionadas ao modelo do produto."

      - name: rowguid
        description: "Identificador global do registro na origem."

      - name: modified_date
        description: "Data da última alteração do modelo na origem."


  - name: stg_adventure_works__production_productsubcategory
    description: "Staging da tabela de subcategorias de produtos da Adventure Works."

    columns:

      - name: PK_product_sub_category
        description: "Identificador único da subcategoria de produto."
        tests:
          - not_null
          - unique

      - name: name_product_subcategory
        description: "Nome da subcategoria de produto."

      - name: FK_product_category
        description: "Identificador da categoria à qual a subcategoria pertence."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__production_productcategory')
                field: PK_product_category

      - name: rowguid
        description: "Identificador global do registro na origem."

      - name: modified_date
        description: "Data da última alteração da subcategoria na origem."


  # ============================================================
  # SALES
  # ============================================================

  - name: stg_adventure_works__sales_customer
    description: "Staging da tabela de clientes da Adventure Works."

    columns:

      - name: PK_customer
        description: "Identificador único do cliente."
        tests:
          - not_null
          - unique

      - name: FK_person
        description: "Identificador da pessoa associada ao cliente. Pode ser nulo para clientes que representam lojas."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__person_person')
                field: PK_business_entity

      - name: FK_store
        description: "Identificador da loja associada ao cliente. Pode ser nulo para clientes pessoa."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_store')
                field: PK_sales_store

      - name: FK_territory
        description: "Identificador do território associado ao cliente."

      - name: account_number
        description: "Número da conta do cliente."

      - name: rowguid
        description: "Identificador global do registro na origem."

      - name: modified_date
        description: "Data da última alteração do cliente na origem."


  - name: stg_adventure_works__sales_store
    description: "Staging da tabela de lojas da Adventure Works."

    columns:

      - name: PK_sales_store
        description: "Identificador único da loja."
        tests:
          - not_null
          - unique

      - name: name_store
        description: "Nome da loja."

      - name: FK_sales_person
        description: "Identificador do vendedor responsável pela loja."

      - name: demographics
        description: "Informações demográficas da loja."

      - name: rowguid
        description: "Identificador global do registro na origem."

      - name: modified_date
        description: "Data da última alteração da loja na origem."


  - name: stg_adventure_works__sales_reason
    description: "Staging da tabela de motivos de venda da Adventure Works."

    columns:

      - name: PK_sales_reason
        description: "Identificador único do motivo de venda."
        tests:
          - not_null
          - unique

      - name: reason_name
        description: "Nome do motivo de venda."

      - name: reason_type
        description: "Tipo ou categoria do motivo de venda."

      - name: modified_date
        description: "Data da última alteração do motivo na origem."


  - name: stg_adventure_works__sales_salesorderheadersalesreason
    description: >
      Staging da tabela associativa entre pedidos e motivos de venda.
      Cada linha representa uma associação entre um pedido e um motivo de venda.

      Grain: uma linha por combinação de FK_sales_order + FK_sales_reason.

    columns:

      - name: FK_sales_order
        description: "Identificador do pedido associado ao motivo de venda."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_salesorderheader')
                field: PK_sales_order

      - name: FK_sales_reason
        description: "Identificador do motivo de venda associado ao pedido."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_reason')
                field: PK_sales_reason

      - name: modified_date
        description: "Data da última alteração do relacionamento na origem."


  - name: stg_adventure_works__sales_salesorderheader
    description: >
      Staging do cabeçalho dos pedidos de venda da Adventure Works.
      Cada linha representa um pedido de venda.

      Grain: uma linha por pedido de venda.

    columns:

      - name: PK_sales_order
        description: "Identificador único do pedido de venda."
        tests:
          - not_null
          - unique

      - name: FK_customer
        description: "Identificador do cliente associado ao pedido."

      - name: FK_sales_person
        description: "Identificador do vendedor associado ao pedido."

      - name: FK_territory
        description: "Identificador do território associado ao pedido."

      - name: FK_bill_to_address
        description: "Identificador do endereço de cobrança do pedido."

      - name: FK_ship_to_address
        description: "Identificador do endereço de entrega do pedido."

      - name: FK_ship_method
        description: "Identificador do método de envio utilizado no pedido."

      - name: FK_credit_card
        description: "Identificador do cartão de crédito utilizado no pedido."

      - name: revision_number
        description: "Número da revisão do pedido."

      - name: order_date
        description: "Data em que o pedido foi realizado."

      - name: due_date
        description: "Data prevista para pagamento ou entrega do pedido."

      - name: ship_date
        description: "Data em que o pedido foi enviado."

      - name: status_order
        description: "Status do pedido."

      - name: online_order_flag
        description: "Indica se o pedido foi realizado online."

      - name: purchase_order_number
        description: "Número do pedido de compra informado pelo cliente."

      - name: account_number
        description: "Número da conta do cliente."

      - name: credit_card_approval_code
        description: "Código de aprovação da transação do cartão de crédito."

      - name: FK_currency_rate
        description: "Identificador da taxa de câmbio utilizada no pedido."

      - name: subtotal
        description: "Subtotal registrado no cabeçalho do pedido."

      - name: tax_amt
        description: "Valor de imposto registrado no cabeçalho do pedido."

      - name: freight
        description: "Valor do frete registrado no cabeçalho do pedido."

      - name: total_due
        description: "Valor total devido registrado no cabeçalho do pedido."

      - name: order_comment
        description: "Comentário associado ao pedido."

      - name: rowguid
        description: "Identificador global do registro na origem."

      - name: modified_date
        description: "Data da última alteração do pedido na origem."


  - name: stg_adventure_works__sales_salesorderdetail
    description: >
      Staging dos itens dos pedidos de venda da Adventure Works.
      Cada linha representa um item de um pedido de venda.

      Grain: uma linha por item de pedido.

    columns:

      - name: PK_sales_order_detail
        description: "Identificador único do item do pedido. Define o grain da tabela."
        tests:
          - not_null
          - unique

      - name: FK_sales_order
        description: "Identificador do pedido ao qual o item pertence."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_salesorderheader')
                field: PK_sales_order

      - name: FK_product
        description: "Identificador do produto associado ao item."

      - name: FK_special_offer
        description: "Identificador da oferta especial aplicada ao item."

      - name: carrier_tracking_number
        description: "Código de rastreamento da transportadora. Pode ser nulo."

      - name: orderqty
        description: "Quantidade de unidades vendidas no item."

      - name: unit_price
        description: "Preço unitário do produto no momento da venda."

      - name: unit_price_discount
        description: "Desconto aplicado ao preço unitário do item."

      - name: rowguid
        description: "Identificador global do item na origem."

      - name: modified_date
        description: "Data da última alteração do item na origem."

  - name: stg_adventure_works__sales_creditcard
    description: >
      Staging da tabela Sales.CreditCard da Adventure Works.
      Mantém o cadastro dos cartões de crédito utilizados nas vendas,
      padronizando nomes e tipos das colunas da fonte.

      Grain: uma linha por cartão de crédito cadastrado na origem.

    columns:

      - name: PK_credit_card
        description: "Identificador único do cartão de crédito na origem."
        tests:
          - not_null
          - unique

      - name: card_type
        description: "Tipo ou emissor do cartão de crédito."

      - name: card_number
        description: "Número do cartão de crédito."

      - name: exp_month
        description: "Mês de expiração do cartão."

      - name: exp_year
        description: "Ano de expiração do cartão."

      - name: modified_date
        description: "Data da última alteração do registro na origem."