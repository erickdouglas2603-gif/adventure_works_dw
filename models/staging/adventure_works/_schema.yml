version: 2

models:

  - name: stg_adventure_works__production_product
    description: "Staging dos produtos da Adventure Works, com padronização de nomes e tipos."

    columns:

      - name: PK_product
        description: "Identificador único do produto."
        tests:
          - not_null
          - unique

      - name: product_name
        description: "Nome do produto."

      - name: product_number
        description: "Código comercial do produto."

      - name: make_flag
        description: "Indica se o produto é fabricado pela empresa."

      - name: finished_goods_flag
        description: "Indica se o produto é um produto acabado."

      - name: color
        description: "Cor do produto."

      - name: safety_stock_level
        description: "Quantidade mínima de estoque de segurança."

      - name: reorder_point
        description: "Quantidade de estoque que determina o momento de reposição."

      - name: standard_cost
        description: "Custo padrão do produto."

      - name: listprice
        description: "Preço de lista do produto."

      - name: size
        description: "Tamanho do produto."

      - name: sizeunitmeasurecode
        description: "Código da unidade de medida utilizada para o tamanho."

      - name: weightunitmeasurecode
        description: "Código da unidade de medida utilizada para o peso."

      - name: weight
        description: "Peso do produto."

      - name: days_to_manufacture
        description: "Quantidade de dias necessários para fabricar o produto."

      - name: product_line
        description: "Linha à qual o produto pertence."

      - name: class
        description: "Classificação do produto."

      - name: style
        description: "Estilo do produto."

      - name: FK_product_sub_category
        description: "Identificador da subcategoria do produto."

      - name: FK_product_model_id
        description: "Identificador do modelo do produto."

      - name: sell_start_date
        description: "Data de início da venda do produto."

      - name: sell_end_date
        description: "Data de término da venda do produto."

      - name: discontinued_date
        description: "Data em que o produto foi descontinuado. Pode ser nula."

      - name: rowguid
        description: "Identificador global do registro na origem."

      - name: modified_date
        description: "Data da última modificação do registro."


  - name: stg_adventure_works__production_productsubcategory
    description: "Staging das subcategorias de produtos da Adventure Works."

    columns:

      - name: PK_product_sub_category
        description: "Identificador único da subcategoria."
        tests:
          - not_null
          - unique

      - name: FK_product_category
        description: "Identificador da categoria à qual a subcategoria pertence."

      - name: product_sub_category_name
        description: "Nome da subcategoria."

      - name: rowguid
        description: "Identificador global do registro na origem."

      - name: modified_date
        description: "Data da última modificação do registro."


  - name: stg_adventure_works__production_productcategory
    description: "Staging das categorias de produtos da Adventure Works."

    columns:

      - name: PK_product_category
        description: "Identificador único da categoria."
        tests:
          - not_null
          - unique

      - name: product_category_name
        description: "Nome da categoria."

      - name: rowguid
        description: "Identificador global do registro na origem."

      - name: modified_date
        description: "Data da última modificação do registro."


  - name: stg_adventure_works__production_productmodel
    description: "Staging dos modelos de produtos da Adventure Works."

    columns:

      - name: PK_product_model
        description: "Identificador único do modelo do produto."
        tests:
          - not_null
          - unique

      - name: product_model_name
        description: "Nome do modelo do produto."

      - name: catalog_description
        description: "Descrição do modelo utilizada no catálogo. Pode ser nula."

      - name: instructions
        description: "Instruções associadas ao modelo do produto. Pode ser nula."

      - name: rowguid
        description: "Identificador global do registro na origem."

      - name: modified_date
        description: "Data da última modificação do registro."