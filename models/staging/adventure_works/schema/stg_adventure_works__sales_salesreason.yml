version: 2

models:

  - name: stg_adventure_works__sales_salesreason
    description: >
      Staging da tabela de motivos de venda da Adventure Works.
      Grain: uma linha por motivo de venda.

    columns:

      - name: PK_motivo_venda
        description: "Identificador único do motivo de venda."
        tests:
          - not_null
          - unique

      - name: data_modificacao
        description: "Data da última modificação do motivo na origem."

      - name: nome_motivo
        description: "Nome do motivo de venda."

      - name: tipo_motivo
        description: "Tipo ou categoria do motivo de venda."