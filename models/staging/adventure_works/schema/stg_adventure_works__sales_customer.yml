version: 2

models:

  - name: stg_adventure_works__sales_customer
    description: >
      Staging da tabela de clientes da Adventure Works.
      Grain: uma linha por cliente.

    columns:

      - name: PK_cliente
        description: "Identificador único do cliente."
        tests:
          - not_null
          - unique

      - name: FK_pessoa
        description: "Identificador da pessoa associada ao cliente."

      - name: FK_loja
        description: "Identificador da loja associada ao cliente."

      - name: FK_territorio
        description: "Identificador do território associado ao cliente."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__sales_salesterritory')
                field: PK_territorio

      - name: data_modificacao
        description: "Data da última modificação do cliente na origem."

      - name: rowguid
        description: "Identificador global do registro na origem."