version: 2

models:
  - name: dim_produtos
    description: "Dimensão de produtos da Adventure Works."

    columns:
      - name: PK_product
        description: "Identificador único do produto."
        tests:
          - not_null
          - unique

      - name: FK_product_sub_category
        description: "Identificador da subcategoria do produto."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__production_productsubcategory')
                field: PK_product_sub_category

      - name: FK_product_category
        description: "Identificador da categoria do produto."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__production_productcategory')
                field: PK_product_category

      - name: FK_product_model_id
        description: "Identificador do modelo do produto."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__production_productmodel')
                field: PK_product_model
  - name: dim_clientes
    description: "Dimensão de clientes da Adventure Works, consolidando clientes pessoa e clientes loja em uma única entidade."

    columns:

          - name: PK_customer
            description: "Identificador único do cliente."
            tests:
              - not_null
              - unique

          - name: FK_person
            description: "Identificador da pessoa associada ao cliente. Pode ser nulo para clientes que representam lojas."

          - name: customer_name
            description: "Nome do cliente. Para clientes pessoa, utiliza o nome da pessoa; para clientes loja, utiliza o nome da loja."

          - name: suffix
            description: "Sufixo do nome da pessoa, quando aplicável. Pode ser nulo para clientes loja."

          - name: FK_store
            description: "Identificador da loja associada ao cliente. Pode ser nulo para clientes pessoa."

          - name: FK_territory
            description: "Identificador do território associado ao cliente."

          - name: rowguid
            description: "Identificador global do registro na origem."

          - name: modified_date
            description: "Data da última modificação do registro."
  
  - name: dim_enderecos
    description: "Dimensão de endereços da Adventure Works, enriquecida com informações de estado e país."

    columns:

      - name: PK_address
        description: "Identificador único do endereço."
        tests:
          - not_null
          - unique

      - name: address_line_1
        description: "Primeira linha do endereço."

      - name: address_line_2
        description: "Segunda linha do endereço. Pode ser nula."

      - name: city
        description: "Cidade do endereço."

      - name: postal_code
        description: "Código postal do endereço."

      - name: FK_state_province
        description: "Identificador do estado ou província associado ao endereço."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__person_stateprovince')
                field: PK_state_province

      - name: state_province_code
        description: "Código do estado ou província."

      - name: state_province_name
        description: "Nome do estado ou província."

      - name: FK_country_region
        description: "Identificador do país ou região associado ao endereço."
        tests:
          - relationships:
              arguments:
                to: ref('stg_adventure_works__person_countryregion')
                field: PK_country_region

      - name: country_region_name
        description: "Nome do país ou região."

      - name: rowguid
        description: "Identificador global do registro na origem."

      - name: modified_date
        description: "Data da última modificação do endereço na origem."

  - name: fato_vendas
    description: >
      Fato de vendas da Adventure Works.
      
      Grain: uma linha por item de pedido (salesorderdetail).
      
      A tabela concentra os eventos transacionais de venda e suas
      métricas quantitativas e monetárias, utilizando chaves estrangeiras
      para relacionamento com as dimensões do Data Warehouse.

    columns:

      - name: PK_sales_order_detail
        description: "Identificador único do item do pedido. Define o grain da fato."
        tests:
          - not_null
          - unique

      - name: FK_sales_order
        description: "Identificador do pedido."

      - name: FK_product
        description: "Identificador do produto."

      - name: FK_customer
        description: "Identificador do cliente."
        tests:
          - relationships:
              arguments:
                to: ref('dim_clientes')
                field: PK_customer

      - name: FK_sales_person
        description: "Identificador do vendedor."

      - name: FK_territory
        description: "Identificador do território associado ao pedido."
        tests:
          - relationships:
              arguments:
                to: ref('dim_territorios')
                field: PK_territory

      - name: FK_bill_to_address
        description: "Identificador do endereço de cobrança."
        tests:
          - relationships:
              arguments:
                to: ref('dim_enderecos')
                field: PK_address

      - name: FK_ship_to_address
        description: "Identificador do endereço de entrega."
        tests:
          - relationships:
              arguments:
                to: ref('dim_enderecos')
                field: PK_address

      - name: FK_ship_method
        description: "Identificador do método de envio."

      - name: FK_credit_card
        description: "Identificador do cartão de crédito."

      - name: FK_special_offer
        description: "Identificador da oferta especial."

      - name: order_date
        description: "Data em que o pedido foi realizado."

      - name: due_date
        description: "Data prevista para entrega."

      - name: ship_date
        description: "Data em que o pedido foi enviado."

      - name: status_order
        description: "Status do pedido."

      - name: online_order_flag
        description: "Indica se o pedido foi realizado online."

      - name: orderqty
        description: "Quantidade de unidades vendidas no item."

      - name: unit_price
        description: "Preço unitário do produto."

      - name: unit_price_discount
        description: "Desconto unitário aplicado ao item."

  - name: dim_motivos
    description: "Dimensão de motivos de venda da Adventure Works. Cada linha representa um motivo de venda."

    columns:

      - name: PK_sales_reason
        description: "Identificador único do motivo de venda."
        tests:
          - not_null
          - unique

      - name: reason_name
        description: "Nome do motivo de venda."

      - name: reason_type
        description: "Tipo ou categoria do motivo de venda."

      - name: modified_date
        description: "Data da última alteração do registro."

  - name: dim_cartoes
    description: >
      Dimensão de cartões de crédito da Adventure Works.

      Grain: uma linha por cartão de crédito cadastrado na origem.
      A dimensão fornece atributos descritivos dos cartões utilizados
      nas vendas, permitindo análises como faturamento por tipo de cartão.

    columns:

      - name: PK_credit_card
        description: "Identificador único do cartão de crédito."
        tests:
          - not_null
          - unique

      - name: card_type
        description: "Tipo ou emissor do cartão de crédito."

      - name: card_number
        description: "Número do cartão de crédito."

      - name: exp_month
        description: "Mês de expiração do cartão."

      - name: exp_year
        description: "Ano de expiração do cartão."

      - name: modified_date
        description: "Data da última alteração do registro na origem."

  - name: dim_territorios
    description: >
      Dimensão de territórios de vendas da Adventure Works.
      
      Grain: uma linha por território.
      
      Contém os atributos geográficos e os indicadores registrados
      na entidade SalesTerritory da origem.

    columns:

      - name: PK_territory
        description: "Identificador único do território."
        tests:
          - not_null
          - unique

      - name: territory_name
        description: "Nome do território de vendas."

      - name: country_region_code
        description: "Código do país ou região associado ao território."

      - name: territory_group
        description: "Grupo geográfico ao qual o território pertence."

      - name: sales_ytd
        description: "Valor de vendas acumulado no ano registrado na origem."

      - name: sales_last_year
        description: "Valor de vendas do ano anterior registrado na origem."

      - name: cost_ytd
        description: "Custo acumulado no ano registrado na origem."

      - name: cost_last_year
        description: "Custo do ano anterior registrado na origem."

      - name: rowguid
        description: "Identificador global do registro na origem."

      - name: modified_date
        description: "Data da última alteração do registro."

  