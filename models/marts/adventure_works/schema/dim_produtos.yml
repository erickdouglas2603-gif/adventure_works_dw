version: 2

models:

  - name: dim_produtos
    description: >
      Dimensão de produtos da Adventure Works.

      Grain: uma linha por produto.

      Contém os atributos descritivos dos produtos,
      incluindo sua classificação por subcategoria,
      categoria e modelo.

    columns:

      - name: PK_produto
        description: "Identificador único do produto."
        tests:
          - not_null
          - unique

      - name: FK_subcategoria_produto
        description: "Identificador da subcategoria do produto."

      - name: FK_categoria_produto
        description: "Identificador da categoria do produto."

      - name: FK_modelo_produto
        description: "Identificador do modelo do produto."

      - name: data_inicio_venda
        description: "Data de início da comercialização do produto."

      - name: data_fim_venda
        description: "Data de encerramento da comercialização do produto."

      - name: data_descontinuacao
        description: "Data em que o produto foi descontinuado. Pode ser nula."

      - name: data_modificacao
        description: "Data da última modificação do produto."

      - name: nome_produto
        description: "Nome comercial do produto."

      - name: numero_produto
        description: "Código ou número do produto."

      - name: indicador_fabricacao
        description: "Indica se o produto é fabricado internamente."

      - name: indicador_produto_acabado
        description: "Indica se o produto é classificado como produto acabado."

      - name: cor
        description: "Cor do produto."

      - name: tamanho_produto
        description: "Tamanho do produto."

      - name: codigo_unidade_tamanho
        description: "Código da unidade de medida utilizada para o tamanho."

      - name: codigo_unidade_peso
        description: "Código da unidade de medida utilizada para o peso."

      - name: linha_produto
        description: "Linha à qual o produto pertence."

      - name: classe
        description: "Classe do produto."

      - name: estilo
        description: "Estilo do produto."

      - name: nome_subcategoria_produto
        description: "Nome da subcategoria do produto."

      - name: nome_categoria_produto
        description: "Nome da categoria do produto."

      - name: nome_modelo_produto
        description: "Nome do modelo do produto."

      - name: descricao_catalogo
        description: "Descrição do produto proveniente do catálogo."

      - name: instrucoes
        description: "Instruções relacionadas ao produto."

      - name: estoque_seguranca
        description: "Nível de estoque de segurança definido para o produto."

      - name: ponto_reposicao
        description: "Ponto de reposição do estoque."

      - name: custo_padrao
        description: "Custo padrão do produto."

      - name: preco_lista
        description: "Preço de lista do produto."

      - name: peso_produto
        description: "Peso do produto."

      - name: dias_fabricacao
        description: "Quantidade de dias necessários para fabricação do produto."