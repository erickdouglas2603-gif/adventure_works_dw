version: 2

models:
  - name: dim_clientes
    description: >
      Dimensão de clientes da Adventure Works, consolidando clientes pessoa
      e clientes loja em uma única entidade.

      Grain: uma linha por cliente.

    columns:

      - name: PK_cliente
        description: "Identificador único do cliente."
        tests:
          - not_null
          - unique

      - name: nome_cliente
        description: >
          Nome do cliente. Para clientes pessoa, utiliza o nome da pessoa;
          para clientes loja, utiliza o nome da loja.

      - name: sufixo
        description: >
          Sufixo do nome da pessoa, quando aplicável.
          Pode ser nulo para clientes loja.

      - name: data_modificacao
        description: "Data da última modificação do registro na origem."